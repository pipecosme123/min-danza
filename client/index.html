<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Identidad: pestaña del navegador (íconos transparentes) y pantalla de
         inicio en móviles (ICONO APP.jpg, con fondo). Fuentes originales en
         src/assets/ICONOS. El ?v= evita el caché "immutable" de .htaccess al
         cambiar un ícono: subir el número si se reemplaza alguno. -->
    <link rel="icon" href="/favicon.ico?v=1" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=1" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png?v=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=1" />
    <link rel="manifest" href="/manifest.webmanifest?v=1" />
    <meta name="apple-mobile-web-app-title" content="Mindanza" />
    <meta name="application-name" content="Mindanza" />
    <!-- Barra del navegador / de la app instalada con el color de la marca (propuesta A):
         magenta en claro y el inicio del degradado oscuro del encabezado en oscuro. -->
    <meta name="theme-color" content="#a3189b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#6d1166" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lista de Equipos, Servicios y Uniformes del ministerio de danza Lluvias de bendiciones."
    />
    <title>Ministerio de Danza 💃🕺</title>
    <script>
      // Aplica el tema guardado (o el del sistema) antes de que React monte,
      // para evitar un parpadeo del tema incorrecto en la primera carga.
      (function () {
        try {
          var saved = localStorage.getItem('app_theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
